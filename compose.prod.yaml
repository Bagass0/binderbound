# Production : `npm run docker:prod`
# (= docker compose --env-file .env.production -f compose.prod.yaml up -d --build)
# → Express sert l'API et le client buildé sur http://localhost:8080, MySQL reste interne.
# Mots de passe et Client ID Google : dans `.env.production` (voir `.env.production.example`).
name: binderbound

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: binderbound
      MYSQL_USER: binderbound
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définis MYSQL_PASSWORD dans .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définis MYSQL_ROOT_PASSWORD dans .env.production}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -ubinderbound -p"$$MYSQL_PASSWORD"']
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      target: prod
    image: binderbound:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://binderbound:${MYSQL_PASSWORD}@db:3306/binderbound
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # true en HTTPS (défaut) ; false seulement pour tester la prod en local sur http://localhost.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - '${PORT:-8080}:3001'
    depends_on:
      db:
        condition: service_healthy
    # Les sets sont lus au démarrage : ajoute un fichier puis `docker compose restart app`.
    volumes:
      - ./server/data/sets:/app/server/data/sets:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
